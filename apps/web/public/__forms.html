<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Hidden forms for Netlify deploy-time detection -->
    <form name="notify" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="notify" />
      <input name="email" type="email" />
      <input name="bot-field" type="text" />
    </form>
  </body>
  
</html>
